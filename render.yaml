databases:
  - name: smartharvest-db
    databaseName: smartharvest
    user: smartharvest_user
    plan: free

services:
  - type: web
    name: smartharvest-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn smart_harvest.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartharvest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
